<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Calculez le coût réel d'un achat ou d'un abonnement sur 1 à 10 ans et trouvez le point de bascule." />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>CoûtRéel — Simulateur TCO</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #111827;
      --surface-2: #1e293b;
      --border: #283548;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent-a: #38bdf8;
      --accent-b: #f97316;
      --good: #22c55e;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 48px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(11, 17, 32, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-a), var(--good));
    }

    .install-btn {
      background: var(--accent-a);
      color: #061220;
      border: none;
      border-radius: 999px;
      padding: 7px 14px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      display: none;
    }

    .install-btn.visible { display: inline-block; }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      gap: 18px;
    }

    .presets {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .presets::-webkit-scrollbar { display: none; }

    .preset-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .preset-chip.active {
      background: var(--surface-2);
      border-color: var(--accent-a);
      color: var(--accent-a);
    }

    .banner {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.14), rgba(34, 197, 94, 0.12));
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .banner-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #e0f2fe;
    }

    .banner-sub {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }

    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    .kpi-label {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .kpi-value {
      font-size: 1.45rem;
      font-weight: 800;
      margin-top: 4px;
    }

    .kpi-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .positive { color: var(--good); }
    .col-a { color: var(--accent-a); }
    .col-b { color: var(--accent-b); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 700;
      margin: 0;
    }

    canvas {
      width: 100%;
      height: 290px;
      display: block;
      border-radius: 12px;
      background: #090e1a;
    }

    .legend {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 0.84rem;
      color: var(--muted);
      margin-top: 10px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.86rem;
      margin-bottom: 4px;
    }

    .field-val {
      font-weight: 700;
      color: var(--text);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-a);
      cursor: pointer;
    }

    input[type="number"], input[type="text"] {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-ghost {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-dot"></span>
      <span>CoûtRéel</span>
    </div>
    <button id="installBtn" class="install-btn">Installer l'appli</button>
  </header>

  <main>
    <div id="presetsBar" class="presets"></div>

    <section class="banner">
      <div id="verdictTitle" class="banner-title">Chargement...</div>
      <div id="verdictSub" class="banner-sub"></div>
    </section>

    <section class="kpis">
      <div class="kpi">
        <div class="kpi-label" id="labelTotalA">Option A</div>
        <div class="kpi-value col-a" id="valTotalA">0 €</div>
        <div class="kpi-sub" id="cpuA">0,00 € / utilisation</div>
      </div>
      <div class="kpi">
        <div class="kpi-label" id="labelTotalB">Option B</div>
        <div class="kpi-value col-b" id="valTotalB">0 €</div>
        <div class="kpi-sub" id="cpuB">0,00 € / utilisation</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Économie nette</div>
        <div class="kpi-value positive" id="valSavings">0 €</div>
        <div class="kpi-sub" id="valBreakeven">Point de bascule : -</div>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <h2 class="card-title">Coût cumulé dans le temps</h2>
        <button id="resetBtn" class="btn-ghost">Réinitialiser le modèle</button>
      </div>
      <canvas id="chartCanvas"></canvas>
      <div class="legend">
        <span><i class="swatch" style="background: var(--accent-a)"></i><strong id="legA">Option A</strong></span>
        <span><i class="swatch" style="background: var(--accent-b)"></i><strong id="legB">Option B</strong></span>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title" style="margin-bottom: 12px;">Fréquence & horizon</h2>
      <div class="field">
        <div class="field-top">
          <span>Utilisations par semaine</span>
          <span class="field-val" id="outUsesWeek">21</span>
        </div>
        <input id="inUsesWeek" type="range" min="1" max="70" step="1" />
      </div>
      <div class="field" style="margin-bottom: 0;">
        <div class="field-top">
          <span>Horizon de simulation (années)</span>
          <span class="field-val" id="outYears">5 ans</span>
        </div>
        <input id="inYears" type="range" min="1" max="10" step="1" />
      </div>
    </section>

    <section class="grid-2">
      <div class="card">
        <h2 class="card-title col-a" style="margin-bottom: 12px;">Option A</h2>
        <div class="field">
          <label class="field-top"><span>Nom</span></label>
          <input id="nameA" type="text" />
        </div>
        <div class="row-2">
          <div class="field">
            <label class="field-top"><span>Achat initial (€)</span></label>
            <input id="initA" type="number" min="0" step="1" />
          </div>
          <div class="field">
            <label class="field-top"><span>Coût / usage (€)</span></label>
            <input id="unitA" type="number" min="0" step="0.01" />
          </div>
        </div>
        <div class="row-2">
          <div class="field">
            <label class="field-top"><span>Fixe / an (€)</span></label>
            <input id="annualA" type="number" min="0" step="1" />
          </div>
          <div class="field">
            <label class="field-top"><span>Revente fin (€)</span></label>
            <input id="resaleA" type="number" min="0" step="1" />
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title col-b" style="margin-bottom: 12px;">Option B</h2>
        <div class="field">
          <label class="field-top"><span>Nom</span></label>
          <input id="nameB" type="text" />
        </div>
        <div class="row-2">
          <div class="field">
            <label class="field-top"><span>Achat initial (€)</span></label>
            <input id="initB" type="number" min="0" step="1" />
          </div>
          <div class="field">
            <label class="field-top"><span>Coût / usage (€)</span></label>
            <input id="unitB" type="number" min="0" step="0.01" />
          </div>
        </div>
        <div class="row-2">
          <div class="field">
            <label class="field-top"><span>Fixe / an (€)</span></label>
            <input id="annualB" type="number" min="0" step="1" />
          </div>
          <div class="field">
            <label class="field-top"><span>Revente fin (€)</span></label>
            <input id="resaleB" type="number" min="0" step="1" />
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const PRESETS = [
      {
        id: "coffee",
        label: "☕ Café : Capsules vs Grains",
        years: 5,
        usesPerWeek: 21,
        a: { name: "Capsules", init: 70, unit: 0.45, annual: 15, resale: 0 },
        b: { name: "Machine à grains", init: 380, unit: 0.14, annual: 35, resale: 40 }
      },
      {
        id: "printer",
        label: "🖨️ Imprimante : Jet d'encre vs Laser",
        years: 4,
        usesPerWeek: 12,
        a: { name: "Jet d'encre", init: 65, unit: 0.18, annual: 0, resale: 0 },
        b: { name: "Laser / Toner", init: 240, unit: 0.04, annual: 10, resale: 25 }
      },
      {
        id: "car",
        label: "🚗 Trajet 50 km : Essence vs Élec",
        years: 5,
        usesPerWeek: 5,
        a: { name: "Essence / usage", init: 0, unit: 6.5, annual: 0, resale: 0 },
        b: { name: "Électrique / usage", init: 3500, unit: 1.6, annual: 120, resale: 1200 }
      }
    ];

    const STORAGE_KEY = "coutreel_state_v1";
    let state = loadState();

    function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && saved.current) return saved;
      } catch (_) {}
      return { presetId: PRESETS[0].id, current: clone(PRESETS[0]) };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // Coût cumulé au mois m (0 -> years * 12)
    function costAtMonth(opt, m, usesPerWeek) {
      const yearsElapsed = m / 12;
      const totalUses = usesPerWeek * 52 * yearsElapsed;
      return opt.init + (opt.unit * totalUses) + (opt.annual * yearsElapsed);
    }

    function netCostEnd(opt, years, usesPerWeek) {
      return Math.max(0, costAtMonth(opt, years * 12, usesPerWeek) - opt.resale);
    }

    function findBreakevenMonth(a, b, years, usesPerWeek) {
      const maxM = years * 12;
      const diff0 = costAtMonth(a, 0, usesPerWeek) - costAtMonth(b, 0, usesPerWeek);
      if (Math.abs(diff0) < 0.01) return null;

      for (let m = 1; m <= maxM; m++) {
        const dPrev = costAtMonth(a, m - 1, usesPerWeek) - costAtMonth(b, m - 1, usesPerWeek);
        const dCurr = costAtMonth(a, m, usesPerWeek) - costAtMonth(b, m, usesPerWeek);
        if ((dPrev <= 0 && dCurr >= 0) || (dPrev >= 0 && dCurr <= 0)) {
          return m;
        }
      }
      return null;
    }

    const fmtEur = (n) => new Intl.NumberFormat("fr-FR", {
      style: "currency",
      currency: "EUR",
      maximumFractionDigits: n % 1 === 0 ? 0 : 2
    }).format(n);

    function renderPresets() {
      const bar = document.getElementById("presetsBar");
      bar.innerHTML = "";
      PRESETS.forEach((p) => {
        const btn = document.createElement("button");
        btn.className = "preset-chip" + (state.presetId === p.id ? " active" : "");
        btn.textContent = p.label;
        btn.onclick = () => {
          state.presetId = p.id;
          state.current = clone(p);
          saveState();
          syncInputs();
          render();
        };
        bar.appendChild(btn);
      });
    }

    function syncInputs() {
      const c = state.current;
      document.getElementById("inUsesWeek").value = c.usesPerWeek;
      document.getElementById("inYears").value = c.years;

      document.getElementById("nameA").value = c.a.name;
      document.getElementById("initA").value = c.a.init;
      document.getElementById("unitA").value = c.a.unit;
      document.getElementById("annualA").value = c.a.annual;
      document.getElementById("resaleA").value = c.a.resale;

      document.getElementById("nameB").value = c.b.name;
      document.getElementById("initB").value = c.b.init;
      document.getElementById("unitB").value = c.b.unit;
      document.getElementById("annualB").value = c.b.annual;
      document.getElementById("resaleB").value = c.b.resale;
    }

    function bindInputs() {
      const c = state.current;
      const map = [
        ["inUsesWeek", (v) => (c.usesPerWeek = Math.max(1, Number(v) || 1))],
        ["inYears", (v) => (c.years = Math.max(1, Number(v) || 1))],
        ["nameA", (v) => (c.a.name = v || "Option A")],
        ["initA", (v) => (c.a.init = Math.max(0, Number(v) || 0))],
        ["unitA", (v) => (c.a.unit = Math.max(0, Number(v) || 0))],
        ["annualA", (v) => (c.a.annual = Math.max(0, Number(v) || 0))],
        ["resaleA", (v) => (c.a.resale = Math.max(0, Number(v) || 0))],
        ["nameB", (v) => (c.b.name = v || "Option B")],
        ["initB", (v) => (c.b.init = Math.max(0, Number(v) || 0))],
        ["unitB", (v) => (c.b.unit = Math.max(0, Number(v) || 0))],
        ["annualB", (v) => (c.b.annual = Math.max(0, Number(v) || 0))],
        ["resaleB", (v) => (c.b.resale = Math.max(0, Number(v) || 0))]
      ];

      map.forEach(([id, fn]) => {
        document.getElementById(id).addEventListener("input", (e) => {
          fn(e.target.value);
          saveState();
          render();
        });
      });

      document.getElementById("resetBtn").onclick = () => {
        const base = PRESETS.find((p) => p.id === state.presetId) || PRESETS[0];
        state.current = clone(base);
        saveState();
        syncInputs();
        render();
      };
    }

    function drawChart(c) {
      const canvas = document.getElementById("chartCanvas");
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;

      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = rect.height;
      const pad = { top: 18, right: 18, bottom: 32, left: 58 };
      const plotW = w - pad.left - pad.right;
      const plotH = h - pad.top - pad.bottom;

      const months = c.years * 12;
      const ptsA = [];
      const ptsB = [];
      let maxVal = 10;

      for (let m = 0; m <= months; m++) {
        const va = costAtMonth(c.a, m, c.usesPerWeek);
        const vb = costAtMonth(c.b, m, c.usesPerWeek);
        ptsA.push(va);
        ptsB.push(vb);
        maxVal = Math.max(maxVal, va, vb);
      }

      maxVal = Math.ceil(maxVal * 1.1);

      ctx.clearRect(0, 0, w, h);

      // Grille horizontale
      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 1;
      ctx.fillStyle = "#94a3b8";
      ctx.font = "11px sans-serif";
      const rows = 4;
      for (let i = 0; i <= rows; i++) {
        const ratio = i / rows;
        const y = pad.top + plotH * (1 - ratio);
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(w - pad.right, y);
        ctx.stroke();

        const val = Math.round(maxVal * ratio);
        ctx.fillText(val + " €", 6, y + 4);
      }

      // Labels années en X
      for (let yr = 0; yr <= c.years; yr++) {
        const x = pad.left + (yr / c.years) * plotW;
        ctx.fillText(yr + "a", x - 6, h - 10);
      }

      function plotLine(pts, color) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        pts.forEach((val, idx) => {
          const x = pad.left + (idx / months) * plotW;
          const y = pad.top + plotH * (1 - val / maxVal);
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      }

      plotLine(ptsA, "#38bdf8");
      plotLine(ptsB, "#f97316");
    }

    function render() {
      const c = state.current;
      document.getElementById("outUsesWeek").textContent = c.usesPerWeek + " / sem";
      document.getElementById("outYears").textContent = c.years + (c.years > 1 ? " ans" : " an");

      document.getElementById("labelTotalA").textContent = c.a.name;
      document.getElementById("labelTotalB").textContent = c.b.name;
      document.getElementById("legA").textContent = c.a.name;
      document.getElementById("legB").textContent = c.b.name;

      const totalA = netCostEnd(c.a, c.years, c.usesPerWeek);
      const totalB = netCostEnd(c.b, c.years, c.usesPerWeek);
      const usesTotal = Math.max(1, c.usesPerWeek * 52 * c.years);

      document.getElementById("valTotalA").textContent = fmtEur(totalA);
      document.getElementById("valTotalB").textContent = fmtEur(totalB);
      document.getElementById("cpuA").textContent = fmtEur(totalA / usesTotal) + " / utilisation";
      document.getElementById("cpuB").textContent = fmtEur(totalB / usesTotal) + " / utilisation";

      const diff = Math.abs(totalA - totalB);
      const winner = totalA <= totalB ? c.a.name : c.b.name;
      const loser = totalA <= totalB ? c.b.name : c.a.name;

      document.getElementById("valSavings").textContent = fmtEur(diff);

      const beMonth = findBreakevenMonth(c.a, c.b, c.years, c.usesPerWeek);
      document.getElementById("valBreakeven").textContent = beMonth
        ? `Point de bascule : ${beMonth} mois`
        : "Point de bascule : aucun sur la période";

      document.getElementById("verdictTitle").textContent =
        `${winner} est plus économique de ${fmtEur(diff)} sur ${c.years} ans`;
      document.getElementById("verdictSub").textContent = beMonth
        ? `L'écart s'inverse au bout de ${beMonth} mois d'utilisation (${c.usesPerWeek} fois/semaine), revente incluse.`
        : `Sur ${c.years} ans à ${c.usesPerWeek} utilisations/semaine, ${winner} reste devant ${loser}.`;

      renderPresets();
      drawChart(c);
    }

    // Gestion installation PWA
    let deferredPrompt;
    const installBtn = document.getElementById("installBtn");
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.add("visible");
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.classList.remove("visible");
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }

    window.addEventListener("resize", () => drawChart(state.current));

    syncInputs();
    bindInputs();
    render();
  </script>
</body>
</html>
