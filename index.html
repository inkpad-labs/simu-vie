  <script>
    const DEFAULT_AI_ENDPOINT = "https://simu-vie.t4tcv52mfj.workers.dev/analyze";

    const PRESETS = [
      { id: "coffee", title: "Cafe : Capsules vs Grains", label: "Cafe : Capsules vs Grains", years: 5, usesPerWeek: 21, a: { name: "Capsules", init: 70, unit: 0.45, annual: 15, resale: 0 }, b: { name: "Machine a grains", init: 380, unit: 0.14, annual: 35, resale: 40 } },
      { id: "printer", title: "Imprimante : Jet d'encre vs Laser", label: "Imprimante : Jet d'encre vs Laser", years: 4, usesPerWeek: 12, a: { name: "Jet d'encre", init: 65, unit: 0.18, annual: 0, resale: 0 }, b: { name: "Laser / Toner", init: 240, unit: 0.04, annual: 10, resale: 25 } },
      { id: "car", title: "Trajet 50 km : Essence vs Elec", label: "Trajet 50 km : Essence vs Elec", years: 5, usesPerWeek: 5, a: { name: "Essence / usage", init: 0, unit: 6.5, annual: 0, resale: 0 }, b: { name: "Electrique / usage", init: 3500, unit: 1.6, annual: 120, resale: 1200 } }
    ];

    const ALT_TEMPLATES = {
      coffee: { nameA: "Option a consommables chers", unitA: 0.45, annualA: 15, resaleA: 0, nameB: "Alternative durable / grains", initMultB: 4.5, initAddB: 80, unitB: 0.14, annualB: 30, resaleB: 40, usesPerWeek: 14 },
      printer: { nameA: "Modele entree de gamme (encre)", unitA: 0.18, annualA: 0, resaleA: 0, nameB: "Alternative plus durable / toner", initMultB: 3.2, initAddB: 60, unitB: 0.04, annualB: 10, resaleB: 25, usesPerWeek: 10 },
      mobility: { nameA: "Option usage / carburant eleve", unitA: 2.5, annualA: 80, resaleA: 0, nameB: "Alternative plus sobre / durable", initMultB: 1.8, initAddB: 250, unitB: 0.7, annualB: 100, resaleB: 200, usesPerWeek: 7 },
      tool: { nameA: "Equipement neuf standard", unitA: 0.5, annualA: 20, resaleA: 15, nameB: "Alternative occasion / pro durable", initMultB: 1.4, initAddB: 40, unitB: 0.2, annualB: 25, resaleB: 50, usesPerWeek: 4 },
      sub: { nameA: "Formule abonnement recurrent", unitA: 0, annualA: 120, resaleA: 0, nameB: "Achat / licence durable", initMultB: 1, initAddB: 180, unitB: 0, annualB: 15, resaleB: 20, usesPerWeek: 7 },
      generic: { nameA: "Article choisi", unitA: 0.5, annualA: 10, resaleA: 0, nameB: "Alternative a cout d'usage reduit", initMultB: 2.2, initAddB: 50, unitB: 0.15, annualB: 20, resaleB: 25, usesPerWeek: 7 }
    };

    const STORAGE_KEY = "coutreel_state_v10";
    let state = loadState();
    let activeLoadedIndex = null;

    function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && saved.current) {
          return {
            presetId: saved.presetId ?? PRESETS[0].id,
            current: { title: saved.current.title || `${saved.current.a?.name || "Option A"} vs ${saved.current.b?.name || "Option B"}`, ...saved.current },
            savedSims: Array.isArray(saved.savedSims) ? saved.savedSims : [],
            showWelcome: saved.showWelcome !== false
          };
        }
      } catch (_) {}
      return { presetId: PRESETS[0].id, current: clone(PRESETS[0]), savedSims: [], showWelcome: true };
    }

    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function costAtMonth(opt, m, usesPerWeek) { const y = m / 12; return opt.init + opt.unit * (usesPerWeek * 52 * y) + opt.annual * y; }
    function netCostEnd(opt, years, usesPerWeek) { return Math.max(0, costAtMonth(opt, years * 12, usesPerWeek) - opt.resale); }

    function findBreakevenMonth(a, b, years, usesPerWeek) {
      const maxM = years * 12;
      if (Math.abs(costAtMonth(a, 0, usesPerWeek) - costAtMonth(b, 0, usesPerWeek)) < 0.01) return null;
      for (let m = 1; m <= maxM; m++) {
        const d0 = costAtMonth(a, m - 1, usesPerWeek) - costAtMonth(b, m - 1, usesPerWeek);
        const d1 = costAtMonth(a, m, usesPerWeek) - costAtMonth(b, m, usesPerWeek);
        if ((d0 <= 0 && d1 >= 0) || (d0 >= 0 && d1 <= 0)) return m;
      }
      return null;
    }

    const fmtEur = (n) => new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: n % 1 === 0 ? 0 : 2 }).format(n);

    function extractPriceFromText(text) {
      if (!text) return null;
      const matches = [...text.matchAll(/(\d{1,5}(?:[.,]\d{1,2})?)\s*(?:\u20ac|eur|euros)?/gi)];
      const vals = matches.map((m) => parseFloat(m[1].replace(",", "."))).filter((n) => !Number.isNaN(n) && n > 0.5 && n < 50000);
      return vals.length ? vals[0] : null;
    }

    function detectCategoryFromText(text) {
      const t = (text || "").toLowerCase();
      if (/caf[eé]|capsule|dosette|grain|expresso/.test(t)) return "coffee";
      if (/imprim|encre|toner|cartouche|feuille|papier/.test(t)) return "printer";
      if (/voiture|essence|diesel|electrique|velo|scooter|km|trajet/.test(t)) return "mobility";
      if (/perceuse|visseuse|outil|jardin|tondeuse|maison/.test(t)) return "tool";
      if (/abonnement|mensuel|mois|forfait/.test(t)) return "sub";
      return "generic";
    }

    function proposeAlternative(priceA, catKey, detectedLabel) {
      const tpl = ALT_TEMPLATES[catKey] || ALT_TEMPLATES.generic;
      const basePrice = Math.max(0, Number(priceA) || 0);
      const c = state.current;
      c.a.name = detectedLabel || tpl.nameA; c.a.init = basePrice; c.a.unit = tpl.unitA; c.a.annual = tpl.annualA; c.a.resale = tpl.resaleA;
      c.b.name = tpl.nameB; c.b.init = Math.round(basePrice * tpl.initMultB + tpl.initAddB); c.b.unit = tpl.unitB; c.b.annual = tpl.annualB; c.b.resale = tpl.resaleB;
      c.usesPerWeek = tpl.usesPerWeek; c.title = `${c.a.name} vs ${c.b.name}`;
      state.presetId = null; state.showWelcome = false; activeLoadedIndex = null; saveState(); syncInputs(); render();
    }

    async function handleTextSearch() {
      const query = document.getElementById("searchItemInput").value.trim();
      const priceRaw = document.getElementById("searchPriceInput").value;
      let cat = document.getElementById("catSelect").value;
      if (cat === "generic" && query) {
        const inferred = detectCategoryFromText(query);
        if (inferred !== "generic") { cat = inferred; document.getElementById("catSelect").value = inferred; }
      }

      if (query && DEFAULT_AI_ENDPOINT) {
        const preview = document.getElementById("scanPreview");
        const status = document.getElementById("scanStatus");
        preview.classList.add("visible");
        document.getElementById("thumbImg").removeAttribute("src");
        status.textContent = `Estimation a domicile pour "${query}"...`;
        try {
          const res = await fetch(DEFAULT_AI_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              queryText: query,
              category: cat,
              priceHint: priceRaw !== "" ? Number(priceRaw) : null
            })
          });
          if (res.ok) {
            const ai = await res.json();
            const c = state.current;
            c.a.name = ai.nomA || query;
            c.a.init = priceRaw !== "" ? Math.max(0, Number(priceRaw) || 0) : (Number(ai.initA) || 49);
            c.a.unit = Number(ai.unitA) || 0.2;
            c.a.annual = Number(ai.annualA) || 0;
            c.a.resale = Number(ai.resaleA) || 0;
            c.b.name = ai.nomB || "Alternative domestique";
            c.b.init = Number(ai.initB) || Math.round(c.a.init * 2);
            c.b.unit = Number(ai.unitB) || 0.1;
            c.b.annual = Number(ai.annualB) || 0;
            c.b.resale = Number(ai.resaleB) || 0;
            if (ai.usesPerWeek) c.usesPerWeek = Math.max(1, Number(ai.usesPerWeek));
            if (ai.years) c.years = Math.min(10, Math.max(1, Number(ai.years)));
            c.title = ai.titre || `${c.a.name} vs ${c.b.name}`;
            state.presetId = null; state.showWelcome = false; activeLoadedIndex = null;
            saveState(); syncInputs(); render();
            status.textContent = `Estime : ${c.a.name} (${fmtEur(c.a.init)}) vs ${c.b.name} (${fmtEur(c.b.init)}).`;
            return;
          }
        } catch (_) {}
      }

      const price = priceRaw !== "" ? Math.max(0, Number(priceRaw) || 0) : (Number(document.getElementById("initA").value) || 49);
      proposeAlternative(price, cat, query || "Article recherche");
    }

    async function compressImageToBase64(file, maxWidth = 900, quality = 0.72) {
      const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
      const img = await new Promise((res, rej) => { const el = new Image(); el.onload = () => res(el); el.onerror = rej; el.src = dataUrl; });
      const scale = Math.min(1, maxWidth / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      return { mimeType: "image/jpeg", imageBase64: canvas.toDataURL("image/jpeg", quality).split(",")[1] };
    }

    async function analyzeWithAI(endpoint, file) {
      const payload = await compressImageToBase64(file);
      const res = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    }

    async function handlePhotoUpload(file) {
      if (!file) return;
      state.showWelcome = false; activeLoadedIndex = null;
      const preview = document.getElementById("scanPreview"), status = document.getElementById("scanStatus"), catSelect = document.getElementById("catSelect");
      preview.classList.add("visible");
      document.getElementById("thumbImg").src = URL.createObjectURL(file);

      if (DEFAULT_AI_ENDPOINT) {
        status.textContent = "Analyse en cours...";
        try {
          const ai = await analyzeWithAI(DEFAULT_AI_ENDPOINT, file);
          const c = state.current;
          c.a.name = ai.nomA || "Article detecte"; c.a.init = Number(ai.initA) || 49; c.a.unit = Number(ai.unitA) || 0.2; c.a.annual = Number(ai.annualA) || 0; c.a.resale = Number(ai.resaleA) || 0;
          c.b.name = ai.nomB || "Alternative proposee"; c.b.init = Number(ai.initB) || Math.round(c.a.init * 2); c.b.unit = Number(ai.unitB) || 0.1; c.b.annual = Number(ai.annualB) || 0; c.b.resale = Number(ai.resaleB) || 0;
          if (ai.usesPerWeek) c.usesPerWeek = Math.max(1, Number(ai.usesPerWeek));
          if (ai.years) c.years = Math.min(10, Math.max(1, Number(ai.years)));
          c.title = ai.titre || `${c.a.name} vs ${c.b.name}`;
          state.presetId = null; saveState(); syncInputs(); render();
          status.textContent = `"${c.a.name}" (${fmtEur(c.a.init)}) compare a "${c.b.name}" (${fmtEur(c.b.init)}).`;
          return;
        } catch (_) {
          status.textContent = "Analyse locale de repli...";
        }
      }

      let price = Number(document.getElementById("initA").value) || 49, cat = catSelect.value;
      if (window.Tesseract) {
        try {
          const res = await Tesseract.recognize(file, "fra+eng");
          const raw = res?.data?.text || "", foundPrice = extractPriceFromText(raw), foundCat = detectCategoryFromText(raw);
          if (foundPrice) price = foundPrice;
          if (foundCat !== "generic") { cat = foundCat; catSelect.value = foundCat; }
          status.textContent = foundPrice ? `Prix detecte : ${fmtEur(price)} - Alternative proposee.` : `Base ${fmtEur(price)} appliquee.`;
        } catch (_) { status.textContent = `Base ${fmtEur(price)} appliquee.`; }
      }
      proposeAlternative(price, cat);
    }

    function renderSavedSims() {
      const list = document.getElementById("savedList");
      list.innerHTML = "";
      if (!state.savedSims.length) { list.innerHTML = `<div class="scan-status">Aucun comparatif enregistre pour l'instant. Donnez un titre puis cliquez sur "Enregistrer".</div>`; return; }
      state.savedSims.forEach((item, idx) => {
        const displayTitle = item.title || `${item.a.name} vs ${item.b.name}`;
        const row = document.createElement("div");
        row.className = "saved-item";
        row.innerHTML = `<div><strong>${displayTitle}</strong><div class="saved-meta">${item.a.name} (${fmtEur(item.a.init)}) vs ${item.b.name} (${fmtEur(item.b.init)}) · ${item.years} ans · ${item.usesPerWeek}/sem · ${item.savedAt || ""}</div></div><div class="saved-actions"><button class="btn-ghost" data-load="${idx}" type="button">Charger</button><button class="btn-ghost" data-upd="${idx}" type="button">Mettre a jour</button><button class="btn-danger" data-del="${idx}" type="button">Suppr.</button></div>`;
        list.appendChild(row);
      });
      list.querySelectorAll("[data-load]").forEach((btn) => btn.onclick = () => {
        const idx = Number(btn.dataset.load);
        const sim = state.savedSims[idx];
        if (!sim) return;
        state.current = clone(sim); state.presetId = null; state.showWelcome = false; activeLoadedIndex = idx;
        saveState(); syncInputs(); render(); window.scrollTo({ top: 0, behavior: "smooth" });
      });
      list.querySelectorAll("[data-upd]").forEach((btn) => btn.onclick = () => {
        const idx = Number(btn.dataset.upd);
        const snap = clone(state.current);
        snap.title = (snap.title || "").trim() || `${snap.a.name} vs ${snap.b.name}`;
        snap.savedAt = new Date().toLocaleDateString("fr-FR");
        state.savedSims[idx] = snap;
        saveState(); renderSavedSims(); alert(`Comparatif "${snap.title}" mis a jour !`);
      });
      list.querySelectorAll("[data-del]").forEach((btn) => btn.onclick = () => {
        const idx = Number(btn.dataset.del);
        state.savedSims.splice(idx, 1);
        if (activeLoadedIndex === idx) activeLoadedIndex = null;
        saveState(); renderSavedSims();
      });
    }

    function renderPresets() {
      const bar = document.getElementById("presetsBar"); bar.innerHTML = "";
      PRESETS.forEach((p) => { const btn = document.createElement("button"); btn.className = "preset-chip" + (state.presetId === p.id ? " active" : ""); btn.textContent = p.label; btn.onclick = () => { state.presetId = p.id; state.current = clone(p); state.showWelcome = false; activeLoadedIndex = null; saveState(); syncInputs(); render(); }; bar.appendChild(btn); });
    }

    function syncInputs() {
      const c = state.current;
      document.getElementById("simTitle").value = c.title || "";
      document.getElementById("inUsesWeek").value = c.usesPerWeek; document.getElementById("inYears").value = c.years;
      document.getElementById("nameA").value = c.a.name; document.getElementById("initA").value = c.a.init; document.getElementById("unitA").value = c.a.unit; document.getElementById("annualA").value = c.a.annual; document.getElementById("resaleA").value = c.a.resale;
      document.getElementById("nameB").value = c.b.name; document.getElementById("initB").value = c.b.init; document.getElementById("unitB").value = c.b.unit; document.getElementById("annualB").value = c.b.annual; document.getElementById("resaleB").value = c.b.resale;
    }

    function bindInputs() {
      const c = state.current;
      const map = [["simTitle", (v) => (c.title = v)], ["inUsesWeek", (v) => (c.usesPerWeek = Math.max(1, Number(v) || 1))], ["inYears", (v) => (c.years = Math.max(1, Number(v) || 1))], ["nameA", (v) => (c.a.name = v || "Option A")], ["initA", (v) => (c.a.init = Math.max(0, Number(v) || 0))], ["unitA", (v) => (c.a.unit = Math.max(0, Number(v) || 0))], ["annualA", (v) => (c.a.annual = Math.max(0, Number(v) || 0))], ["resaleA", (v) => (c.a.resale = Math.max(0, Number(v) || 0))], ["nameB", (v) => (c.b.name = v || "Option B")], ["initB", (v) => (c.b.init = Math.max(0, Number(v) || 0))], ["unitB", (v) => (c.b.unit = Math.max(0, Number(v) || 0))], ["annualB", (v) => (c.b.annual = Math.max(0, Number(v) || 0))], ["resaleB", (v) => (c.b.resale = Math.max(0, Number(v) || 0))]];
      map.forEach(([id, fn]) => document.getElementById(id).addEventListener("input", (e) => { fn(e.target.value); saveState(); render(); }));
      document.getElementById("showWelcomeBtn").onclick = () => { state.showWelcome = true; saveState(); render(); };
      document.getElementById("homeLogo").onclick = () => { state.showWelcome = true; saveState(); render(); };
      document.getElementById("startSimBtn").onclick = () => { state.showWelcome = false; saveState(); render(); };
      document.getElementById("focusSearchBtn").onclick = () => { state.showWelcome = false; saveState(); render(); document.getElementById("searchItemInput").focus(); };
      document.getElementById("searchGoBtn").onclick = handleTextSearch;
      document.getElementById("searchItemInput").addEventListener("keydown", (e) => { if (e.key === "Enter") handleTextSearch(); });
      document.querySelectorAll(".quick-pill").forEach((pill) => {
        pill.onclick = () => {
          document.getElementById("searchItemInput").value = pill.dataset.q;
          document.getElementById("searchPriceInput").value = pill.dataset.p;
          document.getElementById("catSelect").value = pill.dataset.c;
          proposeAlternative(Number(pill.dataset.p), pill.dataset.c, pill.dataset.q);
        };
      });
      document.getElementById("swapBtn").onclick = () => {
        const tmp = clone(state.current.a);
        state.current.a = clone(state.current.b);
        state.current.b = tmp;
        saveState(); syncInputs(); render();
      };
      document.getElementById("photoInput").addEventListener("change", (e) => handlePhotoUpload(e.target.files?.[0]));
      document.getElementById("saveSimBtn").onclick = () => { const snap = clone(state.current); snap.title = (snap.title || "").trim() || `${snap.a.name} vs ${snap.b.name}`; snap.savedAt = new Date().toLocaleDateString("fr-FR"); state.savedSims.unshift(snap); state.savedSims = state.savedSims.slice(0, 50); saveState(); renderSavedSims(); alert(`Comparatif "${snap.title}" enregistre !`); };
      document.getElementById("exportJsonBtn").onclick = () => { const url = URL.createObjectURL(new Blob([JSON.stringify(state.savedSims, null, 2)], { type: "application/json" })); const a = document.createElement("a"); a.href = url; a.download = "coutreel-comparatifs.json"; a.click(); URL.revokeObjectURL(url); };
      document.getElementById("importJsonInput").addEventListener("change", async (e) => { const file = e.target.files?.[0]; if (!file) return; try { const imported = JSON.parse(await file.text()); if (!Array.isArray(imported)) { alert("Fichier JSON invalide."); return; } const valid = imported.filter((s) => s && s.a && s.b); if (!valid.length) { alert("Aucun comparatif valide."); return; } state.savedSims = [...valid, ...state.savedSims].slice(0, 50); saveState(); renderSavedSims(); alert(`${valid.length} comparatif(s) importe(s) !`); } catch (_) { alert("Impossible de lire ce fichier JSON."); } finally { e.target.value = ""; } });
      document.getElementById("resetBtn").onclick = () => { state.current = clone(PRESETS.find((p) => p.id === state.presetId) || PRESETS[0]); saveState(); syncInputs(); render(); };
      document.getElementById("shareBtn").onclick = async () => { const text = `${state.current.title ? `[${state.current.title}] ` : ""}${document.getElementById("verdictTitle").textContent} - ${document.getElementById("verdictSub").textContent}`; if (navigator.share) { try { await navigator.share({ title: "CoutReel", text }); return; } catch (_) {} } navigator.clipboard?.writeText(text); alert("Resume copie !"); };

      const canvas = document.getElementById("chartCanvas");
      const updateHover = (clientX) => {
        const rect = canvas.getBoundingClientRect();
        const padLeft = 58, padRight = 18;
        const plotW = Math.max(1, rect.width - padLeft - padRight);
        const ratio = Math.min(1, Math.max(0, (clientX - rect.left - padLeft) / plotW));
        const months = state.current.years * 12;
        const m = Math.round(ratio * months);
        const va = costAtMonth(state.current.a, m, state.current.usesPerWeek);
        const vb = costAtMonth(state.current.b, m, state.current.usesPerWeek);
        document.getElementById("hoverReadout").textContent =
          `A ${m} mois (${(m / 12).toFixed(1)} ans) - ${state.current.a.name} : ${fmtEur(va)} · ${state.current.b.name} : ${fmtEur(vb)}`;
      };
      canvas.addEventListener("mousemove", (e) => updateHover(e.clientX));
      canvas.addEventListener("touchmove", (e) => { if (e.touches?.[0]) updateHover(e.touches[0].clientX); }, { passive: true });
    }

    function drawChart(c) {
      const canvas = document.getElementById("chartCanvas"), dpr = window.devicePixelRatio || 1, rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
      const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
      const w = rect.width, h = rect.height, pad = { top: 18, right: 18, bottom: 32, left: 58 }, plotW = w - pad.left - pad.right, plotH = h - pad.top - pad.bottom, months = c.years * 12;
      const ptsA = [], ptsB = []; let maxVal = 10;
      for (let m = 0; m <= months; m++) { const va = costAtMonth(c.a, m, c.usesPerWeek), vb = costAtMonth(c.b, m, c.usesPerWeek); ptsA.push(va); ptsB.push(vb); maxVal = Math.max(maxVal, va, vb); }
      maxVal = Math.ceil(maxVal * 1.1); ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 1; ctx.fillStyle = "#94a3b8"; ctx.font = "11px sans-serif";
      for (let i = 0; i <= 4; i++) { const r = i / 4, y = pad.top + plotH * (1 - r); ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke(); ctx.fillText(Math.round(maxVal * r) + " \u20ac", 6, y + 4); }
      for (let yr = 0; yr <= c.years; yr++) { const x = pad.left + (yr / c.years) * plotW; ctx.fillText(yr + "a", x - 6, h - 10); }
      function plotLine(pts, color) { ctx.strokeStyle = color; ctx.lineWidth = 2.8; ctx.beginPath(); pts.forEach((val, idx) => { const x = pad.left + (idx / months) * plotW, y = pad.top + plotH * (1 - val / maxVal); if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }); ctx.stroke(); }
      plotLine(ptsA, "#38bdf8"); plotLine(ptsB, "#f97316");
    }

    function render() {
      document.getElementById("welcomeScreen").style.display = state.showWelcome ? "grid" : "none";
      const c = state.current;
      document.getElementById("outUsesWeek").textContent = c.usesPerWeek + " / sem"; document.getElementById("outYears").textContent = c.years + (c.years > 1 ? " ans" : " an");
      document.getElementById("labelTotalA").textContent = c.a.name; document.getElementById("labelTotalB").textContent = c.b.name;
      document.getElementById("legA").textContent = c.a.name; document.getElementById("legB").textContent = c.b.name;
      const totalA = netCostEnd(c.a, c.years, c.usesPerWeek), totalB = netCostEnd(c.b, c.years, c.usesPerWeek), usesTotal = Math.max(1, c.usesPerWeek * 52 * c.years);
      document.getElementById("valTotalA").textContent = fmtEur(totalA); document.getElementById("valTotalB").textContent = fmtEur(totalB);
      document.getElementById("cpuA").textContent = fmtEur(totalA / usesTotal) + " / utilisation"; document.getElementById("cpuB").textContent = fmtEur(totalB / usesTotal) + " / utilisation";
      const diff = Math.abs(totalA - totalB), winner = totalA <= totalB ? c.a.name : c.b.name, loser = totalA <= totalB ? c.b.name : c.a.name;
      document.getElementById("valSavings").textContent = fmtEur(diff);
      const beMonth = findBreakevenMonth(c.a, c.b, c.years, c.usesPerWeek);
      document.getElementById("valBreakeven").textContent = beMonth ? `Point de bascule : ${beMonth} mois` : "Point de bascule : aucun sur la periode";
      document.getElementById("verdictTitle").textContent = `${winner} est plus economique de ${fmtEur(diff)} sur ${c.years} ans`;
      document.getElementById("verdictSub").textContent = beMonth ? `L'ecart s'inverse au bout de ${beMonth} mois d'utilisation (${c.usesPerWeek} fois/semaine), revente incluse.` : `Sur ${c.years} ans a ${c.usesPerWeek} utilisations/semaine, ${winner} reste devant ${loser}.`;
      renderPresets(); renderSavedSims(); drawChart(c);
    }

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
    window.addEventListener("resize", () => drawChart(state.current));
    syncInputs(); bindInputs(); render();
  </script>
